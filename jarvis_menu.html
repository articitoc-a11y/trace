<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Игровое меню</title>
<style>
  :root{
    --bg:#050a12;
    --panel:rgba(13,25,42,.72);
    --line:rgba(0,229,255,.22);
    --cyan:#00e5ff;
    --cyan-dim:#0aa7bd;
    --gold:#ffd166;
    --text:#d8f4ff;
    --muted:#6f93a8;
    --danger:#ff5470;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 70% -10%,#0c2036 0%,var(--bg) 55%) fixed,var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  /* фоновая сетка */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
  }
  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:34px 26px 60px}

  header{display:flex;align-items:center;gap:22px;margin-bottom:30px;flex-wrap:wrap}
  .reactor{
    width:86px;height:86px;border-radius:50%;position:relative;flex:none;
    background:radial-gradient(circle at 50% 50%,#bffbff 0,#00e5ff 26%,rgba(0,120,160,.35) 55%,transparent 72%);
    animation:pulse 3s ease-in-out infinite;
  }
  .reactor::before,.reactor::after{
    content:"";position:absolute;inset:-10px;border-radius:50%;
    border:1px solid var(--line);border-top-color:var(--cyan);
    animation:spin 6s linear infinite;
  }
  .reactor::after{inset:-20px;border-top-color:transparent;border-left-color:var(--cyan-dim);animation-duration:10s;animation-direction:reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35) drop-shadow(0 0 18px rgba(0,229,255,.55))}}
  h1{font-size:clamp(26px,4vw,42px);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  h1 span{color:var(--cyan);text-shadow:0 0 22px rgba(0,229,255,.6)}
  .sub{color:var(--muted);letter-spacing:.28em;font-size:12px;text-transform:uppercase;margin-top:6px}
  .status{margin-left:auto;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;letter-spacing:.08em}
  .dot{width:10px;height:10px;border-radius:50%;background:#39ff8e;box-shadow:0 0 12px #39ff8e;animation:blink 2s infinite}
  @keyframes blink{50%{opacity:.4}}

  .toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:26px}
  .search{
    flex:1;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 18px;color:var(--text);font-size:15px;outline:none;backdrop-filter:blur(8px);
    transition:border .25s,box-shadow .25s;
  }
  .search:focus{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,229,255,.18)}
  .btn{
    cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);
    padding:13px 22px;border-radius:12px;font-size:15px;letter-spacing:.04em;
    display:inline-flex;align-items:center;gap:9px;transition:.25s;backdrop-filter:blur(8px);
  }
  .btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 22px rgba(0,229,255,.22);transform:translateY(-2px)}
  .btn.primary{background:linear-gradient(135deg,rgba(0,229,255,.18),rgba(0,229,255,.06));border-color:rgba(0,229,255,.55);color:#bff6ff}
  .btn.primary:hover{background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(0,229,255,.12))}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger);box-shadow:0 0 22px rgba(255,84,112,.2)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
  .card{
    position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:22px 20px 20px;cursor:pointer;overflow:hidden;backdrop-filter:blur(10px);
    transition:transform .25s,border-color .25s,box-shadow .25s;
    animation:rise .45s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .card::before{
    content:"";position:absolute;top:-60%;left:-60%;width:60%;height:220%;
    background:linear-gradient(105deg,transparent,rgba(0,229,255,.12),transparent);
    transform:rotate(18deg);transition:left .6s ease;
  }
  .card:hover{transform:translateY(-6px) scale(1.02);border-color:rgba(0,229,255,.65);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 34px rgba(0,229,255,.16)}
  .card:hover::before{left:130%}
  .icon{
    width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:32px;margin-bottom:16px;
    background:linear-gradient(145deg,rgba(0,229,255,.16),rgba(0,229,255,.03));
    border:1px solid var(--line);box-shadow:inset 0 0 18px rgba(0,229,255,.1);
  }
  .icon img{width:100%;height:100%;object-fit:contain;border-radius:14px}
  .name{font-size:18px;font-weight:600;margin-bottom:5px;word-break:break-word}
  .path{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
  .launch-hint{margin-top:14px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan-dim)}
  .del{
    position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;border:1px solid transparent;
    background:rgba(255,84,112,.08);color:var(--danger);font-size:16px;line-height:1;cursor:pointer;
    opacity:0;transition:.2s;display:flex;align-items:center;justify-content:center;
  }
  .card:hover .del{opacity:1}
  .del:hover{background:rgba(255,84,112,.25);border-color:var(--danger)}

  .empty{
    grid-column:1/-1;text-align:center;padding:70px 20px;border:1px dashed var(--line);border-radius:20px;
    color:var(--muted);background:rgba(13,25,42,.35);
  }
  .empty .big{font-size:44px;margin-bottom:14px;filter:grayscale(.3)}

  /* модалка */
  .overlay{
    position:fixed;inset:0;background:rgba(2,6,12,.72);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.open{display:flex}
  .modal{
    width:min(520px,100%);background:linear-gradient(160deg,rgba(16,30,50,.95),rgba(8,16,28,.97));
    border:1px solid rgba(0,229,255,.4);border-radius:20px;padding:30px;
    box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 40px rgba(0,229,255,.12);
    animation:rise .3s ease;
  }
  .modal h2{font-size:22px;letter-spacing:.06em;margin-bottom:6px}
  .modal p.hint{color:var(--muted);font-size:13px;margin-bottom:22px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .field input{
    width:100%;background:rgba(5,12,22,.8);border:1px solid var(--line);border-radius:11px;
    padding:12px 15px;color:var(--text);font-size:15px;outline:none;transition:.25s;
  }
  .field input:focus{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,229,255,.15)}
  .row{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(80px);
    background:rgba(10,22,36,.95);border:1px solid rgba(0,229,255,.5);color:var(--text);
    padding:13px 26px;border-radius:14px;font-size:14px;letter-spacing:.04em;z-index:99;
    box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transition:.35s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{margin-top:40px;text-align:center;color:#3d5a70;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="reactor"></div>
    <div>
      <h1><span>J.A.R.V.I.S.</span> Game Menu</h1>
      <div class="sub">At your service, sir</div>
    </div>
    <div class="status"><span class="dot"></span><span id="clock">--:--:--</span></div>
  </header>

  <div class="toolbar">
    <input id="search" class="search" placeholder="Поиск по названию…">
    <button class="btn primary" onclick="openAdd()">＋ Добавить игру</button>
  </div>

  <div id="grid" class="grid"></div>

  <footer>Voice command: «Джарвис, открой меню» &nbsp;·&nbsp; Ctrl+Alt+M</footer>
</div>

<!-- окно добавления -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Новый ярлык</h2>
    <p class="hint">Укажите название и путь к файлу игры (.exe / .lnk / скрипт). Поле URL — необязательно.</p>
    <div class="field"><label>Название</label><input id="f-name" placeholder="Например: Cyberpunk 2077"></div>
    <div class="field"><label>Путь к игре (exe / lnk)</label><input id="f-path" placeholder="C:\Games\cyberpunk\bin\Cyberpunk2077.exe"></div>
    <div class="field"><label>URL картинки (необязательно)</label><input id="f-icon" placeholder="https://…/cover.jpg"></div>
    <div class="row">
      <button class="btn" onclick="closeAdd()">Отмена</button>
      <button class="btn primary" onclick="saveGame()">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LS_KEY = 'jarvis_games';
const $ = s => document.querySelector(s);
let games = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
let editingIndex = null;

/* ---- серверная синхронизация (если помощник запущен) ---- */
async function pullFromServer(){
  try{
    const r = await fetch('/api/games');
    if(r.ok){ games = await r.json(); localStorage.setItem(LS_KEY, JSON.stringify(games)); render(); }
  }catch(e){/* работаем в офлайн-режиме */}
}
async function pushToServer(){
  try{ await fetch('/api/games', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(games)}); }
  catch(e){/* ок, данные сохранены локально */}
}

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(games)); pushToServer(); render(); }

function esc(t){ return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  const q = $('#search').value.trim().toLowerCase();
  const list = games.map((g,i)=>({g,i})).filter(({g})=>!q||g.name.toLowerCase().includes(q));
  const grid = $('#grid');
  if(!list.length){
    grid.innerHTML = `<div class="empty"><div class="big">🎮</div>
      ${games.length? 'Ничего не найдено.' : 'Меню пусто. Добавьте первую игру кнопкой «＋ Добавить игру» или скажите: «Джарвис, добавь игру».'}</div>`;
    return;
  }
  grid.innerHTML = list.map(({g,i},k)=>`
    <div class="card" style="animation-delay:${k*40}ms" onclick="launch(${i})" title="${esc(g.path)}">
      <button class="del" onclick="removeGame(event,${i})" title="Удалить">✕</button>
      <div class="icon">${g.icon? `<img src="${esc(g.icon)}" onerror="this.parentNode.textContent='🎮'">` : (g.emoji||'🎮')}</div>
      <div class="name">${esc(g.name)}</div>
      <div class="path">${esc(g.path)}</div>
      <div class="launch-hint">▶ Запустить</div>
    </div>`).join('');
}

function launch(i){
  const g = games[i];
  toast(`Запуск: ${g.name}`);
  fetch('/api/launch', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({path:g.path})}).catch(()=>{});
}

function removeGame(ev,i){
  ev.stopPropagation();
  if(confirm(`Удалить ярлык «${games[i].name}»?`)){ games.splice(i,1); save(); toast('Ярлык удалён'); }
}

function openAdd(){ $('#overlay').classList.add('open'); $('#f-name').focus(); }
function closeAdd(){ $('#overlay').classList.remove('open'); ['f-name','f-path','f-icon'].forEach(id=>$('#'+id).value=''); }

function saveGame(){
  const name=$('#f-name').value.trim(), path=$('#f-path').value.trim(), icon=$('#f-icon').value.trim();
  if(!name||!path){ toast('Заполните название и путь'); return; }
  games.push({name,path,icon,emoji:'🎮'});
  closeAdd(); save(); toast(`«${name}» добавлена в меню`);
}

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600);
}

$('#search').addEventListener('input',render);
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeAdd(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeAdd();
  if(e.key==='Enter'&&$('#overlay').classList.contains('open')) saveGame();
});
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('ru-RU'),1000);
$('#clock').textContent=new Date().toLocaleTimeString('ru-RU');
render(); pullFromServer();
</script>
</body>
</html>
